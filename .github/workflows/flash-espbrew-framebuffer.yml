name: Flash & Snap via ESPBrew (framebuffer)

# Side-by-side variant of flash-espbrew.yml that validates the framebuffer
# extraction path end to end:
#
#   * `build`  -> ubuntu: compiles every selected board WITH the board's
#                 `screenshot` feature (the embedded-screenshot crate dumps the
#                 framebuffer over the serial console in the esp_lcd_screenshot
#                 text protocol) and packages the espbrew artifact per board.
#   * `wasm`   -> ubuntu: builds the browser (wasm) build IN PARALLEL with
#                 `build` (it needs only stable + wasm32, no xtensa). The result
#                 is published to GitHub Pages in `deploy` and is NEVER sent to
#                 espbrew.
#   * `snap`   -> [espbrew] self-hosted runner. Flashes via `espbrew snap` with
#                 `--no-capture` so espbrew (>= v0.11.0) extracts the framebuffer
#                 dump from the serial log into framebuffer-<id>.png instead of
#                 a camera JPEG, and stops monitoring as soon as the frame is
#                 complete.
#   * `deploy` -> ubuntu: assembles the GitHub Pages gallery with the shared
#                 `cargo xtask gallery` generator and publishes it. Each board
#                 card shows the captured framebuffer PNG.
#
# Only boards whose firmware implements the `screenshot` feature may be
# selected. The default list contains the boards that currently support it.

on:
  workflow_dispatch:
    inputs:
      boards:
        description: 'Comma-separated project dirs to build/flash (must support the screenshot feature)'
        type: string
        default: 'spooky-maze-esp32-p4-function-ev-board, spooky-maze-esp32-s3-box-3, spooky-maze-m5stack-atom-s3, spooky-maze-m5stack-atom-s3r'
      enable_snap:
        description: 'Flash + capture a framebuffer snapshot via espbrew snap'
        type: boolean
        default: true
      publish_gallery:
        description: 'Deploy framebuffer gallery + WASM browser build to GitHub Pages'
        type: boolean
        default: true
      snap_duration:
        # The framebuffer is ~150 KB of base64 at 320x240 RGB565; at 115200 baud
        # that is ~18 s to drain, so allow headroom beyond the plain camera snap.
        description: 'Snap capture duration (seconds; ~30s needed per 320x240 framebuffer at 115200 baud)'
        type: string
        default: '30'

# Self-hosted runners still need read access to the repository contents.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Parse the comma-separated `boards` input into a JSON array ONCE, then emit
  # it as a job output. `build` and `snap` consume it via `needs.setup`.
  #
  # A matrix expression may only use the `github`, `inputs`, `needs`, `vars`
  # contexts (never `steps`), so the parse cannot live inside a matrix step —
  # it must run in a job that the matrix jobs `need`.
  # ---------------------------------------------------------------------------
  setup:
    name: Parse board selection
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.parse.outputs.json }}
    steps:
      - name: Parse selected boards
        id: parse
        env:
          BOARDS_INPUT: "${{ inputs.boards }}"
        run: |
          set -euo pipefail
          IFS=',' read -r -a parts <<< "${BOARDS_INPUT}"
          json="["
          first=1
          for b in "${parts[@]}"; do
            b="${b//[[:space:]]/}"
            [ -z "$b" ] && continue
            if [ "$first" -eq 1 ]; then json+="\"$b\""; first=0; else json+=", \"$b\""; fi
          done
          json+="]"
          if [ "$first" -eq 1 ]; then
            echo "::error::no boards selected (boards input was empty)" >&2
            exit 1
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "selected boards: ${json}"

  # ---------------------------------------------------------------------------
  # Build + package the selected boards WITH the screenshot feature. One matrix
  # entry per board; each entry builds and packs its own board. All boards share
  # the Xtensa `esp` toolchain, so it is installed once, up-front. The `screenshot`
  # feature only pulls in the embedded-screenshot crate, so the firmware footprint
  # is unchanged for boards that do not enable it.
  # ---------------------------------------------------------------------------
  build:
    name: Build + package ${{ matrix.board }} (screenshot)
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.setup.outputs.boards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain (for cargo/rustup itself)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Xtensa (esp) toolchain
        # espup registers the "esp" toolchain with rustup; the boards'
        # rust-toolchain.toml (channel = "esp") auto-resolve it.
        run: |
          curl -fsSL -o espup \
            "https://github.com/esp-rs/espup/releases/download/v0.17.1/espup-x86_64-unknown-linux-gnu"
          chmod +x espup
          ./espup install --toolchain-version 1.97.0.0

      - name: Put the Xtensa gcc on PATH
        # Several boards' build.rs load ~/export-esp.sh themselves, but
        # spooky-maze-m5stack-core2 and spooky-maze-esp32p4-... do not, so we
        # source it here to guarantee the Xtensa gcc is reachable. We pin
        # RUSTUP_HOME/CARGO_HOME back to the defaults afterwards so rustup still
        # resolves the "esp" toolchain we just installed.
        run: |
          set -euo pipefail
          DEFAULT_RUSTUP_HOME="${HOME}/.rustup"
          DEFAULT_CARGO_HOME="${HOME}/.cargo"
          # shellcheck disable=SC1091
          [ -f "${HOME}/export-esp.sh" ] && source "${HOME}/export-esp.sh" || true
          export RUSTUP_HOME="${DEFAULT_RUSTUP_HOME}"
          export CARGO_HOME="${DEFAULT_CARGO_HOME}"
          echo "PATH=$PATH"
          (xtensa-esp32s3-elf-gcc --version || true)
          (xtensa-esp32-elf-gcc --version || true)

      - name: Build ${{ matrix.board }} (screenshot feature)
        # rustup auto-selects the toolchain from $board/rust-toolchain.toml
        # (channel = "esp"). build.rs (or the PATH above) supplies the linker.
        # --features screenshot enables the embedded-screenshot framebuffer dump.
        working-directory: ${{ matrix.board }}
        run: |
          set -euo pipefail
          echo ">>> Building ${{ matrix.board }} with the screenshot feature"
          cargo build --release --features screenshot

      - name: Package espbrew artifact for ${{ matrix.board }}
        # Emit the minimal espbrew-ready project: Cargo.toml + .cargo/config.toml
        # + target/<triple>/release/<elf>. The triple is read from .cargo/config.toml
        # so the layout matches espbrew's autodetector.
        id: pack
        run: |
          set -euo pipefail
          board="${{ matrix.board }}"
          # Triple from the `target = "..."` line under [build] in .cargo/config.toml.
          # This is the same triple espbrew's autodetector keys on; cut avoids any
          # regex/escaping so the value is extracted verbatim.
          triple="$(grep -m1 '^target = ' "$board/.cargo/config.toml" | cut -d'"' -f2)"
          if [ -z "$triple" ]; then
            echo "::error::could not read target triple from $board/.cargo/config.toml" >&2
            exit 1
          fi
          out="pack-$board"
          rm -rf "$out"
          mkdir -p "$out"
          # Markers espbrew detects.
          cp "$board/Cargo.toml" "$out/"
          mkdir -p "$out/.cargo"
          cp "$board/.cargo/config.toml" "$out/.cargo/"
          # The ELF: largest non-archive file in target/<triple>/release.
          elf="$(find "$board/target/$triple/release" -maxdepth 1 -type f \
                    ! -name '*.d' ! -name '*.o' ! -name '*.a' \
                    ! -name '*.rmeta' ! -name '*.rlib' \
                    -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -1 | cut -f2)"
          if [ -z "${elf:-}" ]; then
            echo "::error::no ELF found under $board/target/$triple/release" >&2
            exit 1
          fi
          mkdir -p "$out/target/$triple/release"
          cp "$elf" "$out/target/$triple/release/"
          echo "triple=$triple" >> "$GITHUB_OUTPUT"
          echo "elf=$(basename "$elf")" >> "$GITHUB_OUTPUT"
          echo "packed $board -> $out (triple=$triple, elf=$(basename "$elf"))"
          ls -la "$out" "$out/target/$triple/release"

      - name: Upload pack-${{ matrix.board }}
        # include-hidden-files MUST be true: espbrew's autodetect keys on the
        # dot-directory .cargo/config.toml, which upload-artifact drops by default.
        uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.board }}
          path: pack-${{ matrix.board }}/
          include-hidden-files: true
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build the browser (wasm) build IN PARALLEL with the board builds above. It
  # needs only the stable toolchain + wasm32 target (no xtensa), so it runs on a
  # plain ubuntu runner alongside `build`. The WASM build is NEVER sent to
  # espbrew — it is published to the gallery in the `deploy` job only.
  # ---------------------------------------------------------------------------
  wasm:
    name: Build WASM browser build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain + wasm32 target
        run: |
          set -euo pipefail
          # WASM needs only stable + wasm32 (no xtensa), so it does not touch the
          # board toolchain and can run in parallel with the firmware build.
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        # wasm-pack builds the crate and emits pkg/. The official installer
        # matches spooky-maze-wasm/build.sh.
        run: |
          set -euo pipefail
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build WASM library (wasm32, release)
        run: |
          set -euo pipefail
          cd spooky-maze-wasm
          # build.rs is a no-op for the wasm32 target, so this only produces the
          # .wasm. --release (not --dev) for the published build.
          wasm-pack build --target web --out-dir pkg --release

      - name: Verify served page present
        run: |
          set -euo pipefail
          # The crate-root index.html references ./pkg/spooky_maze_wasm.js, so it
          # must be shipped alongside pkg/. Fail loud if it is missing.
          if [ ! -f index.html ] || [ ! -f pkg/spooky_maze_wasm.js ] || [ ! -f pkg/spooky_maze_wasm_bg.wasm ]; then
            echo "::error::WASM build incomplete (index.html and pkg/*.js/.wasm required)" >&2
            exit 1
          fi

      - name: Upload WASM build
        # index.html + assets/ (crate root) + pkg/ (wasm-pack output) so the
        # gallery can serve a self-contained browser build at /wasm/.
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            spooky-maze-wasm/index.html
            spooky-maze-wasm/assets/
            spooky-maze-wasm/pkg/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Flash + capture a framebuffer snapshot per selected board on the self-hosted
  # ESPBrew runner.
  #
  # Keep-going (mirrors the flash-espbrew.yml flash loop): the snap job runs even
  # when some builds failed. A board whose build failed has no artifact, so its
  # instance downloads nothing (continue-on-error) and is SKIPPED here, while
  # every board that DID build still flashes + snapshots. `espbrew snap` is only a
  # client to the cluster leader, so it auto-detects the firmware from the
  # downloaded pack-<board> and extracts the framebuffer from the serial log.
  #
  # `--no-capture` tells espbrew to skip the camera; with espbrew >= v0.11.0 the
  # snap zip then contains only the framebuffer PNG extracted from the serial
  # dump. See the note at the bottom about the matching GitHub repository settings.
  # ---------------------------------------------------------------------------
  snap:
    name: Flash & snap (framebuffer)
    needs: [ build, setup ]
    # Keep-going (like flash-espbrew.yml): run even when some builds failed so a
    # board whose build failed is simply SKIPPED here (no artifact to flash)
    # while every board that DID build still flashes + snapshots. `always()`
    # lifts the implicit "all needed jobs must succeed" gating on `needs: build`.
    if: github.event.inputs.enable_snap == 'true' && always()
    runs-on: [espbrew]
    env:
      SNAP_DURATION: "${{ github.event.inputs.snap_duration }}"
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.setup.outputs.boards) }}
    steps:
      # --- Security: never run on untrusted PR / fork code -------------------
      - name: Refuse to run on PRs / forks
        if: github.event.pull_request != null || github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::This hardware workflow only runs on manual dispatch."
          echo "::error::It must never execute on pull requests or fork contributions."
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download espbrew (arch-aware)
        # Framebuffer extraction needs espbrew >= v0.11.0 (esp_lcd_screenshot
        # watcher + PNG extraction); --no-capture as a server-side camera skip
        # needs >= v0.11.1. The repo pins v0.12.0, which satisfies both.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  ESPBREW_ARCH="linux-amd64" ;;
            aarch64) ESPBREW_ARCH="linux-arm64" ;;
            *)       ESPBREW_ARCH="linux-amd64" ;;
          esac
          echo "Downloading espbrew-${ESPBREW_ARCH}"
          curl -fsSL \
            "https://github.com/georgik/espbrew-go/releases/download/v0.12.0/espbrew-${ESPBREW_ARCH}" \
            -o espbrew
          chmod +x ./espbrew
          ./espbrew --version

      - name: Download firmware pack
        # Downloads the per-board artifact uploaded by the `build` job. A matrix
        # expression cannot use the `steps` context, so the download must be a
        # real `uses:` step (not a CLI invocation inside the flash run block).
        #
        # continue-on-error: with keep-going builds, a board whose build failed
        # never uploaded an artifact, so this download fails for that board. We
        # do NOT want one board's missing artifact to abort this instance — the
        # Flash step below detects the gap and skips that board instead.
        uses: actions/download-artifact@v4
        with:
          name: pack-${{ matrix.board }}
          path: pack-${{ matrix.board }}/
        continue-on-error: true

      - name: Resolve espbrew alias for ${{ matrix.board }}
        # boards.yaml maps project dir -> alias registered in the espbrew
        # cluster; fall back to the project dir name when unregistered.
        id: alias
        run: |
          set -euo pipefail
          board="${{ matrix.board }}"
          alias="$(awk -v p="$board" '
            /^  - alias:/ { a=$3 }
            /^    project:/ { if ($2 == p) print a }
          ' boards.yaml)"
          [ -z "$alias" ] && alias="$board"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "alias=$alias"

      - name: Flash + snap ${{ steps.alias.outputs.alias }} (framebuffer)
        run: |
          set -euo pipefail
          board="${{ matrix.board }}"
          alias="${{ steps.alias.outputs.alias }}"

          mkdir -p snapshots
          echo ">>> Flashing + snapping $alias (framebuffer extraction is on by default)"

          # Keep-going: a board whose build failed never produced an artifact, so
          # there is nothing to flash. Skip that board (like the flash-espbrew.yml
          # flash loop does) and let the boards that DID build continue to snap.
          if [ ! -d "pack-$board" ] || [ ! -f "pack-$board/Cargo.toml" ]; then
            echo "::warning::$board pack artifact missing (build skipped/failed); skipping flash"
            exit 0
          fi
          # The artifact MUST carry the markers espbrew autodetects on: Cargo.toml
          # + .cargo/config.toml + an ELF under target/<triple>/release/. A partial
          # artifact means the build/pack step was incomplete — catch it here.
          if [ ! -f "pack-$board/.cargo/config.toml" ]; then
            echo "::warning::$board pack artifact missing .cargo/config.toml; skipping flash"
            exit 0
          fi
          elf="$(find "pack-$board/target" -type f \
                  ! -name '*.d' ! -name '*.o' ! -name '*.rlib' \
                  ! -name '*.rmeta' ! -name '*.a' 2>/dev/null | head -1)"
          if [ -z "$elf" ]; then
            echo "::warning::$board pack artifact has no ELF; skipping flash"
            exit 0
          fi


          # Run from inside the pack dir so espbrew auto-detects the Rust project
          # (Cargo.toml + .cargo/config.toml), locates the ELF, and the cluster
          # leader converts it to bootloader/partitions/app. --no-capture tells the
          # server to skip the camera; the snap zip then contains only the framebuffer
          # PNG extracted from the serial dump. espbrew writes it at snapshots/$board.zip
          # (repo root). The --zip path is relative to pack-$board/, hence the ../.
          ( cd "pack-$board" \
            && espbrew snap \
                --filter-alias "$alias" \
                --no-capture \
                --save-dir snap-out \
                --zip "../snapshots/$board.zip" \
                --duration "$SNAP_DURATION" )

      - name: Upload snapshot zips
        # Upload the raw espbrew snapshot zips (one per board) so the gallery
        # deploy job can expand them. File extraction is intentionally done on
        # the GitHub-hosted deploy runner, NOT on this self-hosted hardware
        # runner: the espbrew runner exists only to flash + capture, so it must
        # not depend on apt/unzip or do any file manipulation.
        if: hashFiles('snapshots/*.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gallery-zips
          path: snapshots/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Assemble and publish the GitHub Pages site: a per-board framebuffer gallery
  # (only the boards that were actually snapshotted appear with an image; the
  # rest get a placeholder) plus the WASM browser build (built in the parallel
  # `wasm` job, never flashed).
  #
  # The gallery publishes whenever publish_gallery is requested and the snap
  # job succeeded or was intentionally skipped (enable_snap=false). It does NOT
  # depend on the WASM build result, so a partial run still publishes a correct
  # gallery. The shared `cargo xtask gallery` generator treats the framebuffer
  # PNG like any other snapshot frame.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy gallery (Pages)
    needs: [ build, wasm, snap ]
    # Keep-going: `always()` lets the gallery publish even when some builds or
    # the WASM build failed. It still only deploys when the snap job actually
    # produced frames (success) or was intentionally turned off (skipped), so a
    # partial run always publishes a correct gallery.
    if: github.event.inputs.publish_gallery == 'true' && always() && (needs.snap.result == 'success' || needs.snap.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM build
        # Best-effort: absent when the wasm job failed/skipped.
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: deploy/wasm

      - name: Download snapshot zips
        # Fails silently when nothing was snapshotted (enable_snap=false or the
        # runner produced no frames).
        uses: actions/download-artifact@v4
        with:
          name: gallery-zips
          path: deploy/site/zips
        continue-on-error: true

      - name: Assemble gallery (xtask)
        # Rust maintenance tool (see xtask/), mirroring the conways project.
        # `cargo xtask` is aliased in .cargo/config.toml to
        # `run --package xtask --`; the first build fetches the `zip` crate from
        # crates.io, then it assembles deploy/site/index.html from the snapshot
        # zips + the WASM build. Runs on the GitHub-hosted deploy runner (NOT
        # the self-hosted hardware runner) — this is where file assembly lives.
        run: cargo xtask gallery

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
