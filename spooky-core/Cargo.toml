[package]
name = "spooky-core"
version = "0.14.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", default-features = false }
bevy_transform = { version = "0.18", default-features = false }
bevy_math = { version = "0.18", default-features = false, features = ["alloc", "libm"] }
bevy_input = { version = "0.18", default-features = false }
bevy_image = { version = "0.18", optional = true }
bevy_render = { version = "0.18", optional = true }
bevy_asset = { version = "0.18", optional = true }


embedded-graphics = "0.8.0"
embedded-graphics-framebuf = { version = "0.3.0", git = "https://github.com/georgik/embedded-graphics-framebuf.git", branch = "feature/embedded-graphics-0.8" }
tinybmp = "0.6.0"
rand = { version = "0.8.5", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
petgraph = { git = "https://github.com/zendurix/petgraph.git", branch = "better_no_std", default-features = false, features = ["graphmap"], optional = true }
maze_generator = { git = "https://github.com/georgik/maze_generator", branch = "feature/no_std", default-features = false, features = [ "recursive_backtracking"], optional = true }
heapless = { version = "0.9.2", default-features = false }
log = "0.4.27"

[features]
std = ["bevy/bevy_asset", "bevy/bevy_sprite", "bevy/bevy_text", "bevy/bevy_ui", "bevy/png", "bevy_image", "bevy_render", "bevy_asset"]
wasm = [ "std" ]
static_maze = []
dynamic_maze = [ "dep:petgraph", "dep:maze_generator" ]
system_timer = []

default = [ "static_maze" ]
