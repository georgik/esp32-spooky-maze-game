[package]
name = "spooky-maze-m5stack-atom-s3r"
version = "0.14.0"
authors = [
    "Juraj Michálek <juraj.michalek@gmail.com>",
    "Kris van Rens <kris@vanrens.org>"
]
edition = "2024"
license = "MIT"

[dependencies]
# Disable default features for Bevy and its sub-crates so that no_std is used.
bevy = { version = "0.18", default-features = false }
bevy_platform = { version = "0.18", default-features = false }


esp-hal = { version = "1.1.0", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19.0", features = [
    "panic-handler",
    "println"
] }
esp-println = { version = "0.17.0", features = [ "log-04" ] }

log = "0.4.29"
esp-alloc = "0.10.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
mipidsi = "0.10.0"
embedded-graphics-framebuf = "0.5.0"
embedded-hal-bus = "0.3.0"
spooky-core = { path = "../spooky-core", default-features = false }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
bmi2 = "0.1.1"

[features]
default = [ "esp-hal/esp32s3", "esp-backtrace/esp32s3", "esp-println/esp32s3", "m5stack-atom-s3r" ]
accelerometer = []
no-psram = []
m5stack-atom-s3r = [ "spooky-core/static_maze" ]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

